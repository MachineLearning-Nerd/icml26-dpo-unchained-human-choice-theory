<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title">
  <title id="title">KLST star axioms force zero abstention</title><rect width="980" height="300" fill="#fff7ed" rx="18"/>
  <g font-family="sans-serif"><text x="48" y="50" font-size="26" font-weight="700" fill="#7c2d12">The advertised abstention channel collapses algebraically</text>
    <text x="490" y="112" text-anchor="middle" font-size="24" fill="#9a3412">p(L&gt;L) − ½ = α(1−α) [ p(a&gt;b)+p(b&gt;a)−1 ] = 0</text>
    <rect x="70" y="150" width="240" height="70" rx="12" fill="#ffedd5"/><text x="190" y="180" text-anchor="middle" font-size="17" fill="#7c2d12">bearability</text><text x="190" y="205" text-anchor="middle" font-size="17" fill="#7c2d12">p(L&gt;L)=½</text>
    <rect x="370" y="150" width="240" height="70" rx="12" fill="#ffedd5"/><text x="490" y="180" text-anchor="middle" font-size="17" fill="#7c2d12">nontrivial lottery</text><text x="490" y="205" text-anchor="middle" font-size="17" fill="#7c2d12">α(1−α)&gt;0</text>
    <rect x="670" y="140" width="240" height="90" rx="12" fill="#fecaca"/><text x="790" y="177" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">choice sum = 1</text><text x="790" y="205" text-anchor="middle" font-size="16" fill="#991b1b">for every atomic pair</text><text x="490" y="270" text-anchor="middle" font-size="16" fill="#7c2d12">Control: remove mixed-lottery bearability → abstention becomes SAT</text></g>
</svg>
