  <g font-family="sans-serif" font-size="18" fill="#e2e8f0">
    <text x="50" y="112">C1 · composite loss</text><rect x="280" y="88" width="620" height="34" rx="8" fill="#dc4962"/><text x="595" y="112" text-anchor="middle" fill="white" font-weight="700">FALSIFIED · endpoint contradiction</text>
    <text x="50" y="164">C2 · regret/Bregman</text><rect x="280" y="140" width="620" height="34" rx="8" fill="#16a085"/><text x="595" y="164" text-anchor="middle" fill="white" font-weight="700">VERIFIED · symbolic residual 0</text>
